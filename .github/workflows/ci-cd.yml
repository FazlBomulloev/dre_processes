name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Зависимости бэкенда
        run: pip install -r backend/requirements.txt flake8==7.5.0
      - name: Проверка стиля
        run: python -m flake8 --max-line-length=79 backend
      - name: Тесты бэкенда
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Линт и сборка фронтенда
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Выкатка на сервер
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Выкатка
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          host=$(printf '%s' "$DEPLOY_HOST" | tr -d "[:space:]\"'")
          host=${host#*@}
          if [ -z "$host" ]; then
            echo "::notice::Секрет DEPLOY_HOST не задан — выкатка пропущена"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Ключ на сервере запускает только scripts/deploy.sh с этим sha.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 \
            "root@$host" "$GITHUB_SHA"
